<!DOCTYPE html>
<html lang="lt">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meteorologijos stočių paieška</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>


<header>

    <div class="header-main">

        <div class="title-area">

            <h1>
                Meteorologijos stočių paieška
            </h1>

        </div>


        <div class="search-area">

            <div class="autocomplete-wrapper">

                <input
                    id="locationInput"
                    type="text"
                    autocomplete="off"
                    placeholder="Miestas arba adresas..."
                >

                <div
                    id="autocompleteResults"
                    class="autocomplete-results"
                ></div>

            </div>


            <button
                id="findButton"
                type="button"
            >
                Ieškoti
            </button>


            <label class="wind-filter">

                <input
                    id="windOnly"
                    type="checkbox"
                >

                <span>
                    Tik vėjo duomenys
                </span>

            </label>

        </div>

    </div>


    <div
        id="status"
        class="status"
    >
        Spustelėkite žemėlapį arba įveskite vietovę
    </div>

</header>


<main>


    <div id="map"></div>


    <div class="results-panel">


        <div class="result-card primary">

            <div class="result-number">
                1
            </div>

            <div>

                <div class="result-label">
                    ARTIMIAUSIA
                </div>

                <div
                    id="primaryName"
                    class="result-name"
                >
                    —
                </div>

                <div
                    id="primaryDistance"
                    class="result-distance"
                >
                    —
                </div>

            </div>

        </div>


        <div class="result-card secondary">

            <div class="result-number">
                2
            </div>

            <div>

                <div class="result-label">
                    ANTROJI
                </div>

                <div
                    id="secondaryName"
                    class="result-name"
                >
                    —
                </div>

                <div
                    id="secondaryDistance"
                    class="result-distance"
                >
                    —
                </div>

            </div>

        </div>


        <div class="result-card tertiary">

            <div class="result-number">
                3
            </div>

            <div>

                <div class="result-label">
                    TREČIOJI
                </div>

                <div
                    id="tertiaryName"
                    class="result-name"
                >
                    —
                </div>

                <div
                    id="tertiaryDistance"
                    class="result-distance"
                >
                    —
                </div>

            </div>

        </div>

    </div>


    <div class="map-legend">


        <div class="legend-title">
            Legenda
        </div>


        <div class="legend-item">

            <span class="legend-symbol location-symbol">
                ●
            </span>

            <span>
                Pasirinkta vieta
            </span>

        </div>


        <div class="legend-item">

            <span class="legend-symbol primary-symbol">
                ★
            </span>

            <span>
                1. Artimiausia stotis
            </span>

        </div>


        <div class="legend-item">

            <span class="legend-symbol secondary-symbol">
                ▲
            </span>

            <span>
                2. Antroji stotis
            </span>

        </div>


        <div class="legend-item">

            <span class="legend-symbol tertiary-symbol">
                ■
            </span>

            <span>
                3. Trečioji stotis
            </span>

        </div>


        <div
            id="windLegendItem"
            class="legend-item"
        >

            <span class="legend-symbol wind-symbol">
                •
            </span>

            <span>
                Vėjo duomenų stotis
            </span>

        </div>

    </div>


    <button
        id="zoomButton"
        class="zoom-button"
        type="button"
        disabled
    >
        Priartinti
    </button>


</main>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script
    src="{{ url_for('static', filename='app.js') }}"
></script>


</body>

</html>
